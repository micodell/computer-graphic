<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebGL Robot Arm</title>
</head>
<body>
<canvas id="glcanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
  const canvas = document.getElementById("glcanvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const gl = canvas.getContext("webgl");
  if (!gl) alert("WebGL not supported");

  // Vertex shader
  const vsSource = `
    attribute vec4 aVertexPosition;
    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;
    void main() {
      gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
    }
  `;

  // Fragment shader
  const fsSource = `
    precision mediump float;
    void main() {
      gl_FragColor = vec4(0.6, 0.7, 0.9, 1.0);
    }
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      alert('Shader compile error: ' + gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function initShaderProgram(gl, vsSource, fsSource) {
    const vertShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
    const program = gl.createProgram();
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      alert('Program failed to link: ' + gl.getProgramInfoLog(program));
      return null;
    }
    return program;
  }

  const shaderProgram = initShaderProgram(gl, vsSource, fsSource);
  const programInfo = {
    program: shaderProgram,
    attribLocations: {
      vertexPosition: gl.getAttribLocation(shaderProgram, 'aVertexPosition'),
    },
    uniformLocations: {
      modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
      projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
    },
  };

  const cubeVertices = [
    // Front face
    -0.5, -0.5,  0.5,
     0.5, -0.5,  0.5,
     0.5,  0.5,  0.5,
    -0.5,  0.5,  0.5,
    // Back face
    -0.5, -0.5, -0.5,
    -0.5,  0.5, -0.5,
     0.5,  0.5, -0.5,
     0.5, -0.5, -0.5,
    // Top face
    -0.5,  0.5, -0.5,
    -0.5,  0.5,  0.5,
     0.5,  0.5,  0.5,
     0.5,  0.5, -0.5,
    // Bottom face
    -0.5, -0.5, -0.5,
     0.5, -0.5, -0.5,
     0.5, -0.5,  0.5,
    -0.5, -0.5,  0.5,
    // Right face
     0.5, -0.5, -0.5,
     0.5,  0.5, -0.5,
     0.5,  0.5,  0.5,
     0.5, -0.5,  0.5,
    // Left face
    -0.5, -0.5, -0.5,
    -0.5, -0.5,  0.5,
    -0.5,  0.5,  0.5,
    -0.5,  0.5, -0.5,
  ];

  const faceIndices = [
    0,1,2, 0,2,3,    // front
    4,5,6, 4,6,7,    // back
    8,9,10, 8,10,11, // top
    12,13,14, 12,14,15, // bottom
    16,17,18, 16,18,19, // right
    20,21,22, 20,22,23  // left
  ];

  function initBuffers(gl) {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cubeVertices), gl.STATIC_DRAW);

    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(faceIndices), gl.STATIC_DRAW);

    return {position: positionBuffer, indices: indexBuffer, vertexCount: faceIndices.length};
  }

  const buffers = initBuffers(gl);

  // Robot part sizes
  const BASE_HEIGHT = 1.0;
  const BASE_WIDTH = 1.0;
  const LOWER_ARM_HEIGHT = 2.0;
  const LOWER_ARM_WIDTH = 0.4;
  const UPPER_ARM_HEIGHT = 1.5;
  const UPPER_ARM_WIDTH = 0.3;

  let theta = [0.0, 0.0, 0.0]; // joint angles θ, φ, ψ

  // Fixed angles in radians
  const degToRad = (deg) => deg * Math.PI / 180;
  const baseAngle = 0;                // Base identity transform
  const bodyAngle = degToRad(-30);   // Body rotation Z
  const armAngle = degToRad(120);    // Arm rotation Z

  // Fixed translation for arm (adjust as suitable)
  const armTx = 0.5;  // example translation X for arm
  const armTy = 0.2;  // example translation Y for arm

  // Projection
  const fieldOfView = 45 * Math.PI / 180;
  const aspect = canvas.clientWidth / canvas.clientHeight;
  const zNear = 0.1;
  const zFar = 100.0;
  const projectionMatrix = glMatrix.mat4.create();
  glMatrix.mat4.perspective(projectionMatrix, fieldOfView, aspect, zNear, zFar);

  function drawCube(gl, programInfo, buffers, modelViewMatrix, scale, translate) {
    const instanceMatrix = glMatrix.mat4.create();
    glMatrix.mat4.translate(instanceMatrix, instanceMatrix, translate);
    glMatrix.mat4.scale(instanceMatrix, instanceMatrix, scale);

    const finalMatrix = glMatrix.mat4.create();
    glMatrix.mat4.multiply(finalMatrix, modelViewMatrix, instanceMatrix);

    gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
    gl.vertexAttribPointer(programInfo.attribLocations.vertexPosition,
                            3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(programInfo.attribLocations.vertexPosition);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.indices);

    gl.useProgram(programInfo.program);
    gl.uniformMatrix4fv(programInfo.uniformLocations.projectionMatrix, false, projectionMatrix);
    gl.uniformMatrix4fv(programInfo.uniformLocations.modelViewMatrix, false, finalMatrix);

    gl.drawElements(gl.TRIANGLES, buffers.vertexCount, gl.UNSIGNED_SHORT, 0);
  }

  function drawScene() {
    gl.clearColor(0.1, 0.1, 0.1, 0.1);
    gl.clearDepth(1.0);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const degToRad = (deg) => deg * Math.PI / 180;
    // Fixed angles
    const baseAngle = 0; // Identity
    const bodyAngle = degToRad(-30);
    const armAngle = degToRad(120);

    const viewMatrix = glMatrix.mat4.create();
    glMatrix.mat4.translate(viewMatrix, viewMatrix, [0, -1, -8]);

    // Base rotation around Y-axis (θ)
    const baseMatrix = glMatrix.mat4.create();
    glMatrix.mat4.rotateY(baseMatrix, viewMatrix, theta[0]);

    drawCube(gl, programInfo, buffers, baseMatrix,
             [BASE_WIDTH, BASE_HEIGHT, BASE_WIDTH],
             [0, BASE_HEIGHT/2, 0]);

    // Lower arm: translate up base height, rotate Z (φ)
    const lowerArmMatrix = glMatrix.mat4.create();
    glMatrix.mat4.translate(lowerArmMatrix, baseMatrix, [0, BASE_HEIGHT, 0]);
    glMatrix.mat4.rotateZ(lowerArmMatrix, lowerArmMatrix, theta[1]);

    drawCube(gl, programInfo, buffers, lowerArmMatrix,
             [LOWER_ARM_WIDTH, LOWER_ARM_HEIGHT, LOWER_ARM_WIDTH],
             [0, LOWER_ARM_HEIGHT/2, 0]);

    // Upper arm: translate up lower arm height, rotate Z (ψ)
    const upperArmMatrix = glMatrix.mat4.create();
    glMatrix.mat4.translate(upperArmMatrix, lowerArmMatrix, [0, LOWER_ARM_HEIGHT, 0]);
    glMatrix.mat4.rotateZ(upperArmMatrix, upperArmMatrix, theta[2]);

    drawCube(gl, programInfo, buffers, upperArmMatrix,
             [UPPER_ARM_WIDTH, UPPER_ARM_HEIGHT, UPPER_ARM_WIDTH],
             [0, UPPER_ARM_HEIGHT/2, 0]);
  }

  function animate() {
    theta[0] += 0.01; // base rotation
    theta[1] += 0.02; // lower arm rotation
    theta[2] += 0.015; // upper arm rotation
    drawScene();
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
